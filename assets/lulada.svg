<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">Lulada de lulo</title>
  <desc id="description">Vaso frío de lulada verde con pulpa de lulo, hielo triturado y limón.</desc>
