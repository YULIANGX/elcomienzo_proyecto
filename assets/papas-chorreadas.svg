      <stop offset=".6" stop-color="#ecd49d"/>
      <stop offset="1" stop-color="#c19652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
