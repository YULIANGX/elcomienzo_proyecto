<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title description">
  <title id="title">Papas chorreadas con quesos regionales</title>
  <desc id="description">Papas criollas bañadas en hogao, con queso Paipa, queso pera y hierbas frescas.</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#3d3024"/>
      <stop offset="1" stop-color="#191715"/>
    </radialGradient>
    <radialGradient id="plate" cx="46%" cy="40%" r="68%">
      <stop stop-color="#f2ebdd"/>
      <stop offset=".78" stop-color="#d8cebb"/>
      <stop offset="1" stop-color="#a79a84"/>
    </radialGradient>
    <linearGradient id="potato" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#f4d28a"/>
      <stop offset=".58" stop-color="#dcae5c"/>
      <stop offset="1" stop-color="#a86e32"/>
    </linearGradient>
    <linearGradient id="hogao" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dd7040"/>
      <stop offset=".55" stop-color="#a83c20"/>
      <stop offset="1" stop-color="#632418"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" x2="1">
